<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Moriah Digital</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      margin:0;
      background:#f4f6f5;
      color:#222;
    }
    .box{
      max-width:900px;
      margin:40px auto;
      background:white;
      border-radius:24px;
      padding:28px;
      box-shadow:0 12px 24px rgba(0,0,0,0.08);
    }
    h1{color:#0f6f2e}
    .btn{
      display:inline-block;
      margin-top:20px;
      padding:14px 20px;
      background:#1f9c47;
      color:white;
      text-decoration:none;
      border:none;
      border-radius:14px;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Bienvenue dans votre espace client</h1>
    <p>Connexion réussie.</p>
    <p>Vous pourrez ici suivre vos commandes, réparations et paiements.</p>
    <button class="btn" id="logoutBtn">Déconnexion</button>
  </div>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
