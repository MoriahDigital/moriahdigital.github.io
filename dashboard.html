<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace client - Moriah Digital</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:Arial,sans-serif;
      background:#f4f7f5;
      color:#1d1d1d;
    }

    header{
      background:#0f6f2e;
      color:white;
      padding:22px 16px;
      text-align:center;
    }

    header h1{
      font-size:2rem;
      margin-bottom:8px;
    }

    .container{
      max-width:1100px;
      margin:auto;
      padding:20px;
    }

    .top-bar{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      gap:12px;
      margin-bottom:20px;
    }

    .card{
      background:white;
      border-radius:16px;
      padding:18px;
      box-shadow:0 8px 20px rgba(0,0,0,0.06);
    }

    .btn{
      display:inline-block;
      padding:12px 18px;
      border-radius:10px;
      background:#129a43;
      color:white;
      text-decoration:none;
      border:none;
      cursor:pointer;
      font-weight:bold;
    }

    .btn-danger{
      background:#c0392b;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:18px;
      margin-bottom:22px;
    }

    .card h2{
      color:#0f6f2e;
      margin-bottom:12px;
      font-size:1.3rem;
    }

    .card p{
      line-height:1.7;
      margin-bottom:8px;
    }

    footer{
      text-align:center;
      padding:22px;
      background:#0b4f20;
      color:white;
      margin-top:30px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Espace client Moriah Digital</h1>
    <p>Bienvenue dans votre espace personnel</p>
  </header>

  <div class="container">

    <div class="top-bar">
      <a href="index.html" class="btn">Retour au site</a>
      <button id="logoutBtn" class="btn btn-danger">Déconnexion</button>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Mon compte</h2>
        <p><strong>Nom :</strong> <span id="clientName">Chargement...</span></p>
        <p><strong>Numéro :</strong> <span id="clientPhone">Chargement...</span></p>
        <p><strong>Email :</strong> <span id="clientEmail">Chargement...</span></p>
      </div>

      <div class="card">
        <h2>Mes informations</h2>
        <p>Vous pouvez suivre vos commandes, réparations et paiements depuis cet espace.</p>
      </div>
    </div>

  </div>

  <footer>
    <p>Moriah Digital - Espace client</p>
  </footer>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const logoutBtn = document.getElementById("logoutBtn");
    const clientName = document.getElementById("clientName");
    const clientPhone = document.getElementById("clientPhone");
    const clientEmail = document.getElementById("clientEmail");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html?mode=login";
        return;
      }

      clientEmail.textContent = user.email || "";

      try {
        const docRef = doc(db, "clients", user.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          clientName.textContent = data.nomPrenom || "";
          clientPhone.textContent = data.numero || "";
          clientEmail.textContent = data.email || user.email || "";
        } else {
          clientName.textContent = "Non disponible";
          clientPhone.textContent = "Non disponible";
        }
      } catch (error) {
        clientName.textContent = "Erreur";
        clientPhone.textContent = "Erreur";
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.href = "login.html?mode=login";
      } catch (error) {
        alert("Impossible de se déconnecter pour le moment.");
      }
    });
  </script>
</body>
</html>
