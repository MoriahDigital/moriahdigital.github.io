<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace client - Moriah Digital</title>
  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:linear-gradient(180deg,#edf4ef 0%,#f8f8f8 100%);
      color:#1d1d1d;
      min-height:100vh;
    }

    .container{
      max-width:560px;
      margin:36px auto;
      padding:20px;
    }

    .card{
      background:#fff;
      border-radius:26px;
      padding:28px 22px;
      box-shadow:0 18px 35px rgba(0,0,0,0.08);
      border:1px solid #e7eeea;
    }

    .logo{
      text-align:center;
      margin-bottom:18px;
    }

    .logo img{
      width:100px;
      border-radius:18px;
      background:#fff;
      padding:6px;
      box-shadow:0 10px 20px rgba(0,0,0,0.12);
    }

    h1{
      text-align:center;
      color:#0f6f2e;
      margin-bottom:10px;
      font-size:2rem;
    }

    .subtitle{
      text-align:center;
      color:#555;
      margin-bottom:24px;
      line-height:1.7;
    }

    .tabs{
      display:flex;
      gap:10px;
      margin-bottom:22px;
    }

    .tab-btn{
      flex:1;
      padding:14px;
      border:none;
      border-radius:14px;
      font-weight:700;
      cursor:pointer;
      background:#e9f3ec;
      color:#0f6f2e;
    }

    .tab-btn.active{
      background:#148c3a;
      color:#fff;
    }

    .form-section{
      display:none;
    }

    .form-section.active{
      display:block;
    }

    label{
      display:block;
      margin:14px 0 8px;
      color:#145c29;
      font-weight:700;
      font-size:1.05rem;
    }

    input{
      width:100%;
      padding:16px;
      border:1px solid #cfd8d3;
      border-radius:18px;
      font-size:1rem;
      outline:none;
    }

    input:focus{
      border-color:#129a43;
      box-shadow:0 0 0 3px rgba(18,154,67,0.12);
    }

    .toggle-password{
      margin-top:8px;
      display:inline-block;
      font-size:0.95rem;
      color:#0f6f2e;
      cursor:pointer;
      font-weight:700;
    }

    button.main-btn{
      width:100%;
      margin-top:18px;
      padding:16px;
      border:none;
      border-radius:18px;
      color:#fff;
      font-size:1.1rem;
      font-weight:700;
      cursor:pointer;
      background:#148c3a;
    }

    .link-btn{
      display:block;
      width:100%;
      margin-top:14px;
      padding:14px;
      border:none;
      border-radius:16px;
      background:#7a7a7a;
      color:#fff;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
    }

    .message{
      margin-top:18px;
      text-align:center;
      font-weight:700;
      min-height:28px;
      line-height:1.5;
    }

    .success{
      color:#148c3a;
    }

    .error{
      color:#b3261e;
    }

    .muted{
      text-align:center;
      color:#666;
      margin-top:16px;
      line-height:1.7;
    }

    .back-link{
      display:inline-block;
      margin-top:18px;
      text-align:center;
      width:100%;
      color:#0f6f2e;
      font-weight:700;
      text-decoration:none;
    }

    @media (max-width:600px){
      h1{
        font-size:1.8rem;
      }

      .card{
        padding:24px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <img src="logo.png" alt="Logo Moriah Digital">
      </div>

      <h1 id="pageTitle">Connexion</h1>
      <p class="subtitle" id="pageSubtitle">
        Connectez-vous à votre espace client.
      </p>

      <div class="tabs">
        <button class="tab-btn active" id="tabLogin" type="button">Connexion</button>
        <button class="tab-btn" id="tabRegister" type="button">Créer un compte</button>
      </div>

      <!-- CONNEXION -->
      <div class="form-section active" id="loginSection">
        <form id="loginForm">
          <label for="loginEmail">Adresse e-mail</label>
          <input type="email" id="loginEmail" placeholder="Entrez votre adresse e-mail" required>

          <label for="loginPassword">Mot de passe</label>
          <input type="password" id="loginPassword" placeholder="Entrez votre mot de passe" required>

          <span class="toggle-password" data-target="loginPassword">Afficher / Masquer le mot de passe</span>

          <button type="submit" class="main-btn">Se connecter</button>
        </form>

        <button type="button" class="link-btn" id="forgotBtn">Mot de passe oublié / Réinitialiser</button>
      </div>

      <!-- CREER UN COMPTE -->
      <div class="form-section" id="registerSection">
        <form id="registerForm">
          <label for="fullName">Nom et prénom</label>
          <input type="text" id="fullName" placeholder="Entrez votre nom et prénom" required>

          <label for="phone">Numéro</label>
          <input type="tel" id="phone" placeholder="Entrez votre numéro" required>

          <label for="registerEmail">Adresse e-mail</label>
          <input type="email" id="registerEmail" placeholder="Entrez votre adresse e-mail" required>

          <label for="registerPassword">Mot de passe</label>
          <input type="password" id="registerPassword" placeholder="Entrez votre mot de passe" required>

          <label for="confirmPassword">Confirmer mot de passe</label>
          <input type="password" id="confirmPassword" placeholder="Confirmez votre mot de passe" required>

          <span class="toggle-password" data-target="registerPassword,confirmPassword">Afficher / Masquer le mot de passe</span>

          <button type="submit" class="main-btn">Créer un compte</button>
        </form>
      </div>

      <div id="message" class="message"></div>

      <p class="muted">
        Votre espace client vous permet de suivre vos commandes, réparations et paiements.
      </p>

      <a href="index.html" class="back-link">← Retour au site</a>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    let mode = params.get("mode") === "register" ? "register" : "login";

    const pageTitle = document.getElementById("pageTitle");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const loginSection = document.getElementById("loginSection");
    const registerSection = document.getElementById("registerSection");
    const message = document.getElementById("message");

    function showMessage(text, type = "") {
      message.textContent = text;
      message.className = "message";
      if (type) message.classList.add(type);
    }

    function setMode(newMode) {
      mode = newMode;

      if (mode === "login") {
        pageTitle.textContent = "Connexion";
        pageSubtitle.textContent = "Connectez-vous à votre espace client.";
        tabLogin.classList.add("active");
        tabRegister.classList.remove("active");
        loginSection.classList.add("active");
        registerSection.classList.remove("active");
      } else {
        pageTitle.textContent = "Créer un compte";
        pageSubtitle.textContent = "Créez votre compte pour accéder à votre espace client.";
        tabRegister.classList.add("active");
        tabLogin.classList.remove("active");
        registerSection.classList.add("active");
        loginSection.classList.remove("active");
      }

      showMessage("");
    }

    setMode(mode);

    tabLogin.addEventListener("click", () => setMode("login"));
    tabRegister.addEventListener("click", () => setMode("register"));

    document.querySelectorAll(".toggle-password").forEach(toggle => {
      toggle.addEventListener("click", () => {
        const ids = toggle.dataset.target.split(",");
        ids.forEach(id => {
          const input = document.getElementById(id.trim());
          if (input) {
            input.type = input.type === "password" ? "text" : "password";
          }
        });
      });
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showMessage("Connexion réussie. Redirection...", "success");

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);

      } catch (error) {
        let errorText = "Impossible de se connecter pour le moment.";

        if (error.code === "auth/invalid-credential") {
          errorText = "E-mail ou mot de passe incorrect.";
        } else if (error.code === "auth/invalid-email") {
          errorText = "Adresse e-mail invalide.";
        } else if (error.code === "auth/network-request-failed") {
          errorText = "Problème de connexion Internet.";
        }

        showMessage("Erreur : " + errorText, "error");
      }
    });

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("registerEmail").value.trim();
      const password = document.getElementById("registerPassword").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();

      if (!fullName || !phone) {
        showMessage("Veuillez remplir le nom et le numéro.", "error");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Les mots de passe ne correspondent pas.", "error");
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);

        await setDoc(doc(db, "clients", userCredential.user.uid), {
          nomPrenom: fullName,
          numero: phone,
          email: email,
          dateCreation: new Date().toISOString()
        });

        showMessage("Compte créé avec succès. Redirection...", "success");

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);

      } catch (error) {
        let errorText = "Impossible de créer le compte.";

        if (error.code === "auth/email-already-in-use") {
          errorText = "Cette adresse e-mail est déjà utilisée.";
        } else if (error.code === "auth/invalid-email") {
          errorText = "Adresse e-mail invalide.";
        } else if (error.code === "auth/weak-password") {
          errorText = "Mot de passe trop faible. Utilisez au moins 6 caractères.";
        } else if (error.code === "auth/network-request-failed") {
          errorText = "Problème de connexion Internet.";
        }

        showMessage("Erreur : " + errorText, "error");
      }
    });

    document.getElementById("forgotBtn").addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();

      if (!email) {
        showMessage("Entrez votre adresse e-mail pour réinitialiser le mot de passe.", "error");
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        showMessage("E-mail de réinitialisation envoyé.", "success");
      } catch (error) {
        showMessage("Erreur : impossible d'envoyer l'e-mail de réinitialisation.", "error");
      }
    });
  </script>
</body>
</html>
