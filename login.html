<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace client - Moriah Digital</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:linear-gradient(180deg,#eef4ef,#f8f8f8);
      min-height:100vh;
      padding:24px 12px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .container{
      background:white;
      width:100%;
      max-width:470px;
      padding:32px 22px;
      border-radius:26px;
      box-shadow:0 12px 28px rgba(0,0,0,0.14);
    }

    .logo{
      width:110px;
      display:block;
      margin:0 auto 16px;
      border-radius:18px;
      box-shadow:0 8px 18px rgba(0,0,0,0.12);
    }

    h1{
      color:#1b7c36;
      text-align:center;
      margin-bottom:10px;
      font-size:2rem;
    }

    .subtitle{
      text-align:center;
      color:#555;
      margin-bottom:22px;
      line-height:1.7;
    }

    hr{
      margin:28px 0;
      border:none;
      border-top:1px solid #d9d9d9;
    }

    label{
      display:block;
      text-align:left;
      margin-top:14px;
      font-weight:bold;
      color:#1b7c36;
      font-size:1rem;
    }

    .field-wrap{
      position:relative;
      margin-top:6px;
    }

    .field-wrap input{
      width:100%;
      padding:14px 50px 14px 14px;
      border-radius:18px;
      border:1px solid #ccc;
      font-size:16px;
      outline:none;
      background:white;
    }

    .field-wrap input:focus{
      border-color:#1f9c47;
      box-shadow:0 0 0 3px rgba(31,156,71,0.12);
    }

    .eye-btn{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:transparent;
      font-size:20px;
      cursor:pointer;
      width:auto;
      padding:0;
      margin:0;
      line-height:1;
      color:#666;
    }

    .main-btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:18px;
      font-size:16px;
      margin-top:18px;
      cursor:pointer;
      font-weight:bold;
    }

    .login{
      background:#1f9c47;
      color:white;
    }

    .register{
      background:#0f6f2e;
      color:white;
    }

    .reset{
      background:#777;
      color:white;
    }

    .main-btn:hover{
      opacity:0.94;
    }

    .message{
      margin-top:16px;
      text-align:center;
      font-weight:bold;
      line-height:1.6;
      min-height:24px;
    }

    .error{
      color:#b3261e;
    }

    .success{
      color:#1b7c36;
    }

    .small{
      margin-top:18px;
      font-size:14px;
      text-align:center;
      color:#666;
      line-height:1.7;
    }

    .back-link{
      display:block;
      text-align:center;
      margin-top:16px;
      text-decoration:none;
      color:#1b7c36;
      font-weight:bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo.png" class="logo" alt="Logo Moriah Digital">

    <h1>Connexion</h1>
    <p class="subtitle">Connectez-vous à votre espace client.</p>

    <form id="loginForm">
      <label for="loginEmail">Adresse e-mail</label>
      <div class="field-wrap">
        <input type="email" id="loginEmail" placeholder="Entrez votre adresse e-mail" required>
      </div>

      <label for="loginPassword">Mot de passe</label>
      <div class="field-wrap">
        <input type="password" id="loginPassword" placeholder="Entrez votre mot de passe" required>
        <button type="button" class="eye-btn" data-target="loginPassword">👁</button>
      </div>

      <button type="submit" class="main-btn login">Se connecter</button>
      <button type="button" class="main-btn reset" id="resetBtn">Mot de passe oublié / Réinitialiser</button>
    </form>

    <div id="loginMessage" class="message"></div>

    <hr>

    <h1>Créer un compte</h1>

    <form id="registerForm">
      <label for="fullName">Nom complet</label>
      <div class="field-wrap">
        <input type="text" id="fullName" placeholder="Votre nom complet" required>
      </div>

      <label for="phone">Numéro</label>
      <div class="field-wrap">
        <input type="tel" id="phone" placeholder="Votre numéro" required>
      </div>

      <label for="registerEmail">Adresse e-mail</label>
      <div class="field-wrap">
        <input type="email" id="registerEmail" placeholder="Votre email" required>
      </div>

      <label for="registerPassword">Mot de passe</label>
      <div class="field-wrap">
        <input type="password" id="registerPassword" placeholder="Créer un mot de passe" required>
        <button type="button" class="eye-btn" data-target="registerPassword">👁</button>
      </div>

      <label for="confirmPassword">Confirmer mot de passe</label>
      <div class="field-wrap">
        <input type="password" id="confirmPassword" placeholder="Confirmer votre mot de passe" required>
        <button type="button" class="eye-btn" data-target="confirmPassword">👁</button>
      </div>

      <button type="submit" class="main-btn register">Créer mon compte</button>
    </form>

    <div id="registerMessage" class="message"></div>

    <p class="small">
      Votre espace client vous permet de suivre vos commandes, réparations et paiements.
    </p>

    <a href="index.html" class="back-link">← Retour au site</a>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const loginMessage = document.getElementById("loginMessage");
    const registerMessage = document.getElementById("registerMessage");

    function showMessage(element, text, type) {
      element.textContent = text;
      element.className = "message " + type;
    }

    document.querySelectorAll(".eye-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        input.type = input.type === "password" ? "text" : "password";
      });
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      showMessage(loginMessage, "", "");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showMessage(loginMessage, "Connexion réussie. Redirection...", "success");

          window.location.href = "dashboard.html";
        }, 1000);
