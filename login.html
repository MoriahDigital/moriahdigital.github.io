<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - Moriah Digital</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Arial,sans-serif;
      background:linear-gradient(180deg,#edf4ef 0%,#f8f8f8 100%);
      color:#1d1d1d;
      min-height:100vh;
    }
    .container{
      max-width:520px;
      margin:40px auto;
      padding:20px;
    }
    .card{
      background:#fff;
      border-radius:26px;
      padding:28px 22px;
      box-shadow:0 18px 35px rgba(0,0,0,0.08);
      border:1px solid #e7eeea;
    }
    .logo{text-align:center;margin-bottom:18px}
    .logo img{
      width:100px;
      border-radius:18px;
      background:#fff;
      padding:6px;
      box-shadow:0 10px 20px rgba(0,0,0,0.12);
    }
    h1{
      text-align:center;
      color:#0f6f2e;
      margin-bottom:10px;
      font-size:2rem;
    }
    .subtitle{
      text-align:center;
      color:#555;
      margin-bottom:24px;
      line-height:1.7;
    }
    label{
      display:block;
      margin:14px 0 8px;
      color:#145c29;
      font-weight:700;
      font-size:1.1rem;
    }
    input{
      width:100%;
      padding:16px;
      border:1px solid #cfd8d3;
      border-radius:18px;
      font-size:1.05rem;
      outline:none;
    }
    button{
      width:100%;
      margin-top:16px;
      padding:16px;
      border:none;
      border-radius:18px;
      color:#fff;
      font-size:1.15rem;
      font-weight:700;
      cursor:pointer;
    }
    #mainBtn{background:#148c3a}
    #switchBtn{background:#0f6f2e}
    #forgotBtn{background:#7a7a7a}
    .message{
      margin-top:18px;
      text-align:center;
      font-weight:700;
      min-height:28px;
      line-height:1.5;
    }
    .success{color:#148c3a}
    .error{color:#b3261e}
    .muted{
      text-align:center;
      color:#666;
      margin-top:14px;
      line-height:1.7;
    }
    .divider{
      margin:18px 0 8px;
      text-align:center;
      color:#666;
      font-weight:bold;
    }
    .back-link{
      display:inline-block;
      margin-top:18px;
      text-align:center;
      width:100%;
      color:#0f6f2e;
      font-weight:700;
      text-decoration:none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <img src="logo.png" alt="Logo Moriah Digital">
      </div>

      <h1 id="pageTitle">Connexion</h1>
      <p class="subtitle" id="pageSubtitle">
        Connectez-vous à votre compte existant pour accéder à votre espace client.
      </p>

      <form id="authForm">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" placeholder="Entrez votre adresse e-mail" required>

        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Entrez votre mot de passe" required>

        <button type="submit" id="mainBtn">Se connecter</button>
      </form>

      <div class="divider" id="switchText">Pas encore de compte ?</div>
      <button type="button" id="switchBtn">Créer un compte</button>

      <div class="divider">Mot de passe oublié ?</div>
      <button type="button" id="forgotBtn">Réinitialiser le mot de passe</button>

      <div id="message" class="message"></div>

      <p class="muted">
        En vous connectant, vous pouvez retrouver plus facilement les services,
        produits et informations de Moriah Digital.
      </p>

      <a href="index.html" class="back-link">← Retour au site</a>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const params = new URLSearchParams(window.location.search);
    let mode = params.get("mode") === "register" ? "register" : "login";

    const form = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const mainBtn = document.getElementById("mainBtn");
    const switchBtn = document.getElementById("switchBtn");
    const forgotBtn = document.getElementById("forgotBtn");
    const message = document.getElementById("message");
    const pageTitle = document.getElementById("pageTitle");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const switchText = document.getElementById("switchText");

    function showMessage(text, type = "") {
      message.textContent = text;
      message.className = "message";
      if (type) message.classList.add(type);
    }

    function updateMode() {
      if (mode === "login") {
        pageTitle.textContent = "Connexion";
        pageSubtitle.textContent = "Connectez-vous à votre compte existant pour accéder à votre espace client.";
        mainBtn.textContent = "Se connecter";
        switchText.textContent = "Pas encore de compte ?";
        switchBtn.textContent = "Créer un compte";
      } else {
        pageTitle.textContent = "Créer un compte";
        pageSubtitle.textContent = "Créez votre compte pour accéder à votre espace client.";
        mainBtn.textContent = "Créer un compte";
        switchText.textContent = "Vous avez déjà un compte ?";
        switchBtn.textContent = "Connexion";
      }
    }

    updateMode();

    switchBtn.addEventListener("click", () => {
      mode = mode === "login" ? "register" : "login";
      updateMode();
      showMessage("");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      showMessage("");

      try {
        if (mode === "login") {
          await signInWithEmailAndPassword(auth, email, password);
          showMessage("Connexion réussie. Redirection...", "success");
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
          showMessage("Compte créé avec succès. Redirection...", "success");
        }

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);

      } catch (error) {
        let errorText = "Impossible de continuer pour le moment.";

        if (error.code === "auth/email-already-in-use") {
          errorText = "Cette adresse e-mail est déjà utilisée.";
        } else if (error.code === "auth/invalid-credential") {
          errorText = "E-mail ou mot de passe incorrect.";
        } else if (error.code === "auth/invalid-email") {
          errorText = "Adresse e-mail invalide.";
        } else if (error.code === "auth/weak-password") {
          errorText = "Mot de passe trop faible. Utilisez au moins 6 caractères.";
        } else if (error.code === "auth/network-request-failed") {
          errorText = "Problème de connexion Internet.";
        }

        showMessage("Erreur : " + errorText, "error");
      }
    });

    forgotBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();

      if (!email) {
        showMessage("Entrez votre adresse e-mail pour réinitialiser le mot de passe.", "error");
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        showMessage("E-mail de réinitialisation envoyé.", "success");
      } catch (error) {
        showMessage("Erreur : impossible d'envoyer l'e-mail de réinitialisation.", "error");
      }
    });
  </script>
</body>
</html>
