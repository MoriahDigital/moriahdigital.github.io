<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Espace client - Moriah Digital</title>

<style>

body{
font-family:Arial;
background:linear-gradient(180deg,#eef4ef,#f8f8f8);
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
width:90%;
max-width:420px;
text-align:center;
}

.logo{
width:110px;
margin-bottom:15px;
}

h1{
color:#1b7c36;
margin-bottom:10px;
}

p{
color:#555;
margin-bottom:20px;
}

label{
display:block;
text-align:left;
margin-top:12px;
font-weight:bold;
color:#1b7c36;
}

input{
width:100%;
padding:14px;
margin-top:6px;
border-radius:15px;
border:1px solid #ccc;
font-size:16px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:18px;
font-size:16px;
margin-top:18px;
cursor:pointer;
}

.login{
background:#1f9c47;
color:white;
}

.register{
background:#0f6f2e;
color:white;
}

.reset{
background:#777;
color:white;
}

button:hover{
opacity:0.9;
}

.small{
margin-top:15px;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>Connexion</h1>

<p>Connectez-vous à votre espace client.</p>

<label>Adresse e-mail</label>
<input type="email" placeholder="Entrez votre adresse e-mail">

<label>Mot de passe</label>
<input type="password" placeholder="Entrez votre mot de passe">

<button class="login">Se connecter</button>

<button class="reset">Mot de passe oublié / Réinitialiser</button>

<hr style="margin:25px 0">

<h1>Créer un compte</h1>

<label>Nom complet</label>
<input type="text" placeholder="Votre nom">

<label>Adresse e-mail</label>
<input type="email" placeholder="Votre email">

<label>Mot de passe</label>
<input type="password" placeholder="Créer un mot de passe">

<label>Confirmer mot de passe</label>
<input type="password" placeholder="Confirmer votre mot de passe">

<button class="register">Créer mon compte</button>

<p class="small">
Votre espace client vous permet de suivre vos commandes, réparations et paiements.
</p>

</div>

</body>
</html>
